# Sized for a 16GB machine. The Gradle daemon, the Kotlin daemon and Dart's
# gen_snapshot all run at once during a release build, so the daemon heap has
# to leave room for the other two. -Xmx8G here caused swap thrashing.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx2G
org.gradle.caching=true
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
