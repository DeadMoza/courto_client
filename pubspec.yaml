name: client_app
description: "Manage courto fields"

publish_to: 'none' 


version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  table_calendar: ^3.2.0
  flutter_localizations:
    sdk: flutter
  onesignal_flutter: ^5.3.4
  flutter_dotenv: ^6.0.0
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^5.0.0


flutter:

  uses-material-design: true


  assets:
    - .env
    - assets/images/courto.png
    
  fonts:
    - family: Changa
      fonts:
        - asset: assets/Changa-SemiBold.ttf
          weight: 600


flutter_launcher_icons: 
  flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/courtoManagerLogo.png"
  adaptive_icon_background: "#FFFFEBEE"  # or a color hex
  adaptive_icon_foreground: "assets/images/courtoManagerLogo.png"
  remove_alpha_ios: true
